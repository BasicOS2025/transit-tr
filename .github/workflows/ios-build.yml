name: Transit TR iOS build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-ios:
    runs-on: macos-15
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue and build with Apple SDK
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project ios/TransitTR.xcodeproj -scheme TransitTR -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/transit-ios" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/xcodebuild.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transit-ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
